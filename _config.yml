# ---------------------------------------------------------------------------
# Site settings. Everything you are likely to change lives in this file.
# After editing, commit and push — GitHub Pages rebuilds automatically.
# ---------------------------------------------------------------------------

title: Omar Maali Hussein
tagline: Solution Architect · AI Engineer · Certified Trainer
description: >-
  Solution architect, AI engineer and certified trainer. Agentic systems,
  retrieval, the evaluation work most teams skip, and teaching engineering
  teams to build with AI. Published with the evidence.

# The live address of the site. Change this if you move to a custom domain,
# e.g. url: "https://omarmaali.com"
url: "https://omarmaali.github.io"
baseurl: ""

# --- Contact and profiles ---------------------------------------------------
# The email is split in two so it is not sitting in the HTML as one string
# for scrapers to lift. The page reassembles it in the browser.
email_user: omrr
email_domain: outlook.com

linkedin: "https://www.linkedin.com/in/omarmaali/"
github: "https://github.com/omarmaali"
outsystems_article: "https://www.linkedin.com/pulse/embedding-generative-ai-outsystems-11-assistant-module-omar-hussein-spqsf/"

# --- Build ------------------------------------------------------------------
permalink: /writing/:title/
timezone: Asia/Riyadh
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    default_lang: text

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Default social-preview image for every page. jekyll-seo-tag reads `image`
# from a page's front matter, not from a bare site-level key, so it is applied
# to all pages here via Jekyll front matter defaults.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-card.png