<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preload" href="{{ '/assets/fonts/inter-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/inter-latin-700-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  {%- feed_meta -%}
  {%- seo -%}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <ul>
        <li class="hide-sm"><a href="{{ '/#work' | relative_url }}">Work</a></li>
        <li><a href="{{ '/writing/' | relative_url }}" {% if page.url contains '/writing' %}aria-current="page"{% endif %}>Writing</a></li>
        <li class="hide-sm"><a href="{{ '/#credentials' | relative_url }}">Background</a></li>
        <li><a href="{{ '/#contact' | relative_url }}">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main">
  {{ content }}
</main>

{% include footer.html %}
</body>
</html>
